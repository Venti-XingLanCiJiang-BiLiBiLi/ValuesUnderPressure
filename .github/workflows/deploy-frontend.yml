# ============================================================================
# Deploy Frontend to GitHub Pages
# ----------------------------------------------------------------------------
# 触发：push 到 main / 手动触发 (workflow_dispatch)
# 流程：frontend/ 子目录 → npm ci → npm run build → 上传 artifact → 部署
# 访问：https://<user>.github.io/ValuesUnderPressure/
#
# **后端 API 配置（重要）**
# GitHub Pages 是静态托管，没有自己的后端。前端代码里的 API base URL 由
# VITE_API_BASE_URL 环境变量控制：
#   - 默认 '/api'（要求前端和后端同源，例如用 nginx/cloudflare 反代）
#   - 跨域时设为后端公网 URL，例如 'https://api.your-domain.com/api'
#   - 后端必须允许该域名跨域（CORS allow_origins=* 即可，已在 backend 开启）
#
# 配置方式（在 GitHub 仓库页面）：
#   1. Settings → Secrets and variables → Actions → Variables
#   2. 新建变量 VITE_API_BASE_URL，值为你的后端完整 URL
#   3. 也可以用 Secrets 保护更敏感的 URL
# ============================================================================

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# 并发控制：取消上一次正在跑的部署，避免多次部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

# 权限：部署到 GitHub Pages 需要 pages: write 和 id-token: write
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # --------------------------------------------------------------------------
  # 1. 构建
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          # 优先用 Variables（非敏感），其次 Secrets，最后用默认 /api
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '/api' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # --------------------------------------------------------------------------
  # 2. 部署
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
