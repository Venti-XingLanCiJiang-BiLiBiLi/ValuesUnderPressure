# ============================================================================
# VUP 前端 Nginx 配置
# ----------------------------------------------------------------------------
# 职责：
#   1. 托管 Vite 构建产物（/usr/share/nginx/html）
#   2. Vue Router history 模式回退到 index.html
#   3. 把 /api 反代到后端容器（compose 服务名 backend:8000）
# 被 frontend/Dockerfile 复制为 /etc/nginx/conf.d/default.conf。
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # 带内容 hash 的静态资源可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式：找不到路径时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（不带 URI，保持 /api/... 原样转发）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # FastAPI 自动文档（未挂在 /api 下，单独反代，方便查看）
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
